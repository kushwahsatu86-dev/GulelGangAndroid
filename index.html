<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>गुलेल गैंग</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1233; touch-action: none; -webkit-user-select: none; user-select: none;
    font-family: "Noto Sans Devanagari", "Mangal", "Nirmala UI", "Kohinoor Devanagari", system-ui, sans-serif; color: #fff7e8; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#cv { display: block; touch-action: none; }
  #ov { position: fixed; inset: 0; display: flex; background: rgba(26,18,51,0.9); padding: 16px; box-sizing: border-box; overflow: auto; z-index: 5; -webkit-user-select: none; }
  #ov.hidden { display: none; }
  .wrap { margin: auto; max-width: 980px; width: 100%; text-align: center; }
  h1 { font-size: clamp(30px, 7vw, 60px); margin: 0 0 6px; color: #ffcf5a; }
  p { font-size: clamp(15px, 2.8vw, 20px); margin: 6px 0; line-height: 1.5; color: #f3e6d0; }
  #stars { font-size: 44px; color: #ffcf5a; margin: 2px 0; }
  .row { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
  .row.col { flex-direction: column; align-items: center; }
  button { font: inherit; font-size: 20px; padding: 12px 26px; border-radius: 14px; border: 0; cursor: pointer; color: #1a1233; background: #ffcf5a; }
  button.alt { background: transparent; color: #ffcf5a; border: 2px solid #ffcf5a; }
  button[disabled] { opacity: 0.4; cursor: default; }
  .row.col button { min-width: 260px; }
  #hb { position: fixed; top: 8px; right: 8px; display: none; gap: 8px; z-index: 4; }
  #hb button { padding: 6px 14px; font-size: 16px; border-radius: 10px; }
  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 12px; }
  .card { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,207,90,0.35); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .card canvas { width: 72px; height: 72px; }
  .card b { font-size: 18px; color: #ffcf5a; }
  .card span { font-size: 13px; color: #f3e6d0; line-height: 1.35; min-height: 2.7em; }
  .card button { font-size: 14px; padding: 7px 12px; border-radius: 10px; margin-top: 4px; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 14px; }
  .lvb { padding: 10px 0; font-size: 22px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; line-height: 1.2; }
  .lvb small { font-size: 13px; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hb"><button id="rs" class="alt">फिर से</button><button id="mn" class="alt">मेन्यू</button></div>
<div id="ov"></div>


<script src="matter.min.js"></script>
<script>if (typeof Matter === "undefined") document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"><\/script>');</script>
<script>
(() => {
  const W = 1280, H = 720, GY = 640, LCOUNT = 20;
  const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
  const ov = document.getElementById("ov"), hb = document.getElementById("hb");
  const $ = id => document.getElementById(id);
  cv.width = W; cv.height = H;
  function fit() { const s = Math.min(innerWidth / W, innerHeight / H); cv.style.width = W * s + "px"; cv.style.height = H * s + "px"; }
  addEventListener("resize", fit); fit();

  if (typeof Matter === "undefined") {
    ov.innerHTML = "<div class='wrap'><h1>गुलेल गैंग</h1><p>गेम की physics library लोड नहीं हुई. एक बार इंटरनेट चालू करके पेज खोलें, या matter.min.js फ़ाइल इसी फ़ोल्डर में रखें.</p></div>";
    return;
  }
  const { Engine, Bodies, Body, Composite, Events } = Matter;
  const ANCH = { x: 230, y: 500 };

  // ---------- save ----------
  const KEY = "gulel_gang_save_v2";
  let save = { coins: 60, unlocked: [0], team: [0], stars: {}, maxL: 0, currentLevel: 0, muted: false };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") save = Object.assign(save, s); } catch (e) {}
  function persist() { try { localStorage.setItem(KEY, JSON.stringify(save)); } catch (e) {} }

  // ---------- 15 original birds ----------
  const TYPES = [
    { name: "पीलू",     color: "#ffd23f", acc: "#c26a00", r: 18, dens: 0.004,  power: "dash",      cost: 0,    desc: "टैप पर तेज़ रफ़्तार" },
    { name: "नीलू",     color: "#4a6fe3", acc: "#cfe0ff", r: 16, dens: 0.0035, power: "split3",    cost: 120,  desc: "टैप पर 3 में बँट जाती है" },
    { name: "तोता",     color: "#3fbf7f", acc: "#ff8a2a", r: 17, dens: 0.004,  power: "boomerang", cost: 200,  desc: "टैप पर पीछे मुड़ जाता है" },
    { name: "गुलाबो",   color: "#ef6f9b", acc: "#ffffff", r: 17, dens: 0.003,  power: "float",     cost: 300,  desc: "टैप पर हवा में तैरती है" },
    { name: "कालू",     color: "#3a3a4a", acc: "#ffd23f", belly: "#7a7a90", r: 19, dens: 0.0045, power: "bomb", cost: 450, desc: "टैप पर धमाका करता है" },
    { name: "सफ़ेदा",   color: "#f1f1f5", acc: "#e0526b", belly: "#ffe9c2", r: 17, dens: 0.0035, power: "egg", cost: 600, desc: "टैप पर नीचे बम-अंडा गिराती है" },
    { name: "संतरी",    color: "#ff8f1f", acc: "#fff3c4", r: 18, dens: 0.0045, power: "dive",      cost: 800,  desc: "टैप पर सीधी नीचे झपटती है" },
    { name: "जामुनी",   color: "#9a5de0", acc: "#ffd23f", r: 16, dens: 0.0035, power: "split5",    cost: 1000, desc: "टैप पर 5 में बँटती है" },
    { name: "भोलू",     color: "#9a6a3c", acc: "#f6d9a8", r: 21, dens: 0.0045, power: "giant",     cost: 1300, desc: "टैप पर बड़ा और भारी हो जाता है" },
    { name: "फ़िरोज़ी",  color: "#22c7c0", acc: "#07524f", r: 17, dens: 0.0035, power: "bounce",    cost: 1600, desc: "टैप पर उछलने वाली गेंद बनती है" },
    { name: "सुनहरी",   color: "#e6b422", acc: "#ffffff", r: 18, dens: 0.005,  power: "hammer",    cost: 2000, desc: "टैप पर पत्थर तोड़ने की ताक़त" },
    { name: "चाँदी",    color: "#b9c4d6", acc: "#3b4a63", r: 17, dens: 0.004,  power: "rocket",    cost: 2500, desc: "टैप पर रॉकेट की तरह भागती है" },
    { name: "लहरिया",   color: "#a8d62f", acc: "#2d5a0a", r: 17, dens: 0.0035, power: "wave",      cost: 3000, desc: "टैप पर लहराती हुई उड़ती है" },
    { name: "केसरी",    color: "#d1495b", acc: "#ffe3a0", r: 18, dens: 0.004,  power: "cluster",   cost: 3500, desc: "टैप पर 3 छोटे बम गिराती है" },
    { name: "राजा",     color: "#2d3a8c", acc: "#ffd23f", r: 20, dens: 0.0055, power: "royal",     cost: 4500, desc: "टैप पर तेज़, और टकराते ही बड़ा धमाका" }
  ];

  // ---------- level generator (stable by construction) ----------
  // ---GEN-START
  function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function genLevel(L, GY) {
    const r = mulberry32(L * 977 + 13), pick = a => a[Math.floor(r() * a.length)];
    const nT = Math.min(4, 1 + Math.floor(L / 3));
    const stoneP = Math.max(0, Math.min(0.85, (L - 2) * 0.08));
    const nTargets = Math.min(10, 2 + Math.floor(L / 2));
    const nShield = Math.min(3, Math.floor(L / 6));
    const birds = Math.min(7, 3 + Math.floor(L / 4));
    const guests = L >= 1 ? 1 + (L >= 9 ? 1 : 0) + (L >= 15 ? 1 : 0) : 0;
    const items = [], slots = [];
    const mat = p => (r() < p ? "stone" : "wood");
    let spans = []; for (let i = 0; i < nT; i++) spans.push(pick([80, 90, 100]));
    let gap = nT > 1 ? 70 + Math.floor(r() * 30) : 0;
    let totalW = spans.reduce((a, s) => a + s + 40, 0) + gap * (nT - 1);
    if (totalW > 520) { spans = spans.map(() => 80); gap = nT > 1 ? 70 : 0; totalW = spans.reduce((a, s) => a + s + 40, 0) + gap * (nT - 1); }
    let cursor = Math.max(700, Math.min(780 + Math.floor(r() * 60), 1235 - totalW));
    const towers = [];
    for (let i = 0; i < nT; i++) {
      const span = spans[i], width = span + 40, cx = cursor + width / 2, left = cursor, right = cursor + width;
      const maxF = Math.min(4, 1 + Math.floor(L / 4));
      const floors = Math.max(1, Math.min(4, maxF - (r() < 0.35 ? 1 : 0)));
      let base = GY;
      for (let f = 0; f < floors; f++) {
        const h = pick([64, 76, 90]), sp = stoneP * (1 - f * 0.15);
        items.push({ k: "box", x: cx - span / 2, y: base - h / 2, w: 20, h, mat: mat(sp) });
        items.push({ k: "box", x: cx + span / 2, y: base - h / 2, w: 20, h, mat: mat(sp) });
        items.push({ k: "box", x: cx, y: base - h - 10, w: span + 40, h: 20, mat: mat(stoneP * 0.7) });
        slots.push({ x: cx, y: base - 20 });
        base -= h + 20;
      }
      slots.push({ x: cx, y: base - 20 });
      if (i < nT - 1) slots.push({ x: right + gap / 2, y: GY - 20 });
      towers.push({ left, right, cx });
      cursor = right + gap;
    }
    const last = towers[towers.length - 1];
    if (last.right + 50 < 1245) slots.push({ x: last.right + 50, y: GY - 20 });
    for (let k = 0; k < nShield; k++) {
      const h = pick([100, 120, 140]);
      items.push({ k: "box", x: towers[0].left - 45 - k * 45, y: GY - h / 2, w: 22, h, mat: mat(Math.min(0.95, stoneP + 0.25)) });
    }
    const n = Math.min(nTargets, slots.length);
    for (let i = slots.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [slots[i], slots[j]] = [slots[j], slots[i]]; }
    for (let i = 0; i < n; i++) items.push({ k: "target", x: slots[i].x, y: slots[i].y });
    return { birds, guests, items };
  }
  // ---GEN-END

  // ---------- state ----------
  let engine, items = [], extras = [], blasts = [], bird = null, lineup = [], li = 0, spec = null;
  let level = 0, score = 0, levelStartScore = 0, coinsThisLevel = 0, state = "menu", dragging = false;
  let particles = [], rings = [], floaters = [], shake = 0, endTimer = 0, spawnTimer = 0, tMs = 0;

  // ---------- sound ----------
  let ac = null;
  function snd(f, d = 0.12, type = "square", v = 0.05, slide = 0) {
    if (save.muted) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(); o.stop(t + d);
    } catch (e) {}
  }

  // ---------- world ----------
  function addBox(x, y, w, h, mat) {
    const b = Bodies.rectangle(x, y, w, h, { label: "block", density: mat === "stone" ? 0.004 : 0.002, friction: 0.8, restitution: 0.05, frictionAir: 0.01 });
    b.hp = b.maxHp = mat === "stone" ? 400 : 140; b.mat = mat; b.w = w; b.h = h; b.hit = 0;
    Composite.add(engine.world, b); items.push(b);
  }
  function addTarget(x, y) {
    const b = Bodies.circle(x, y, 20, { label: "target", density: 0.0012, friction: 0.5, restitution: 0.2, frictionAir: 0.01 });
    b.hp = b.maxHp = 30; b.r = 20; b.hit = 0;
    Composite.add(engine.world, b); items.push(b);
  }
  function makeLineup(L, sp) {
    const team = save.team.length ? save.team : [0], arr = [];
    for (let i = 0; i < sp.birds; i++) arr.push({ id: team[i % team.length], guest: false });
    const pool = []; for (let id = 0; id < TYPES.length; id++) if (id <= Math.min(14, 3 + L)) pool.push(id);
    for (let g = 0; g < Math.min(sp.guests, sp.birds - 1); g++) arr[sp.birds - 1 - g] = { id: pool[Math.floor(Math.random() * pool.length)], guest: true };
    return arr;
  }
  function loadLevel(i) {
    level = i; save.currentLevel = Math.max(0, Math.min(LCOUNT - 1, i)); persist(); engine = Engine.create(); engine.positionIterations = 8; engine.velocityIterations = 6;
    items = []; extras = []; blasts = []; particles = []; rings = []; floaters = []; bird = null; dragging = false; shake = 0; endTimer = 0; spawnTimer = 0; coinsThisLevel = 0;
    levelStartScore = score;
    Composite.add(engine.world, Bodies.rectangle(W / 2, GY + 50, W * 4, 100, { isStatic: true, label: "ground", friction: 1 }));
    spec = genLevel(i, GY);
    for (const it of spec.items) { if (it.k === "box") addBox(it.x, it.y, it.w, it.h, it.mat); else addTarget(it.x, it.y); }
    lineup = makeLineup(i, spec); li = 0;
    Events.on(engine, "collisionStart", onCollide);
    Events.on(engine, "collisionActive", onActive);
    state = "play"; ov.className = "hidden"; hb.style.display = "flex";
    nextBird();
  }
  function startLevel(i) { score = i === 0 ? 0 : score; loadLevel(i); }
  function nextBird() {
    if (li >= lineup.length) { bird = null; return; }
    const e = lineup[li++], t = TYPES[e.id];
    bird = Bodies.circle(ANCH.x, ANCH.y, t.r, { label: "bird", density: t.dens, restitution: 0.4, friction: 0.8, frictionAir: 0, collisionFilter: { group: -1 } });
    Object.assign(bird, { r: t.r, color: t.color, power: t.power, tid: e.id, guest: e.guest, flying: false, used: false, life: 0, slow: 0, dmgMult: 1.5 });
    Body.setStatic(bird, true); Composite.add(engine.world, bird);
  }
  function spawnChild(x, y, r, color, vx, vy, o) {
    const c = Bodies.circle(x, y, r, { label: "bird", density: o.density || 0.0035, restitution: 0.4, friction: 0.8, frictionAir: 0, collisionFilter: { group: -1 } });
    Object.assign(c, { r, color, tid: o.tid || 0, kind: o.kind || "bird", bomb: !!o.bomb, bombR: o.bombR, bombP: o.bombP, life: 0, slow: 0, dmgMult: 1.5 });
    Body.setVelocity(c, { x: vx, y: vy }); Composite.add(engine.world, c); extras.push(c);
  }

  // ---------- powers ----------
  function fan(b, angles, r) {
    const v = b.velocity, p = b.position;
    for (const a of angles) {
      const c = Math.cos(a), s = Math.sin(a);
      spawnChild(p.x, p.y, r, b.color, v.x * c - v.y * s, v.x * s + v.y * c, { kind: "bird", tid: b.tid });
    }
  }
  function useAbility(b) {
    b.used = true;
    const v = b.velocity, p = b.position;
    const ring = () => rings.push({ x: p.x, y: p.y, r: b.r, a: 1 });
    switch (b.power) {
      case "dash": Body.setVelocity(b, { x: v.x * 1.55, y: v.y * 1.55 }); ring(); snd(520, 0.18, "sawtooth", 0.05, 500); break;
      case "split3": fan(b, [-0.22, 0.22], 11); ring(); snd(700, 0.15, "triangle", 0.06, 300); break;
      case "split5": fan(b, [-0.34, -0.17, 0.17, 0.34], 9); ring(); snd(760, 0.18, "triangle", 0.06, 300); break;
      case "boomerang": Body.setVelocity(b, { x: -v.x * 0.9, y: v.y * 0.3 - 2 }); ring(); snd(420, 0.2, "triangle", 0.06, -200); break;
      case "float": b.floatT = 100; ring(); snd(300, 0.3, "sine", 0.06, 300); break;
      case "bomb": blasts.push({ x: p.x, y: p.y, R: 135, P: 330 }); b.dead = true; break;
      case "egg": spawnChild(p.x, p.y + b.r + 4, 10, "#fff", 0, 7, { kind: "egg", bomb: true, bombR: 80, bombP: 190, density: 0.008 }); Body.setVelocity(b, { x: v.x * 1.2, y: -7 }); ring(); snd(500, 0.12, "square", 0.05, -200); break;
      case "dive": Body.setVelocity(b, { x: v.x * 0.15, y: 24 }); ring(); snd(600, 0.2, "sawtooth", 0.05, -450); break;
      case "giant": Body.scale(b, 1.9, 1.9); b.r *= 1.9; ring(); snd(150, 0.3, "sawtooth", 0.07, 60); break;
      case "bounce": b.restitution = 1; Body.setVelocity(b, { x: v.x * 1.1, y: v.y * 1.1 }); ring(); snd(700, 0.12, "triangle", 0.06, 200); break;
      case "hammer": b.hammer = true; b.dmgMult = 2.5; Body.setVelocity(b, { x: v.x * 1.3, y: v.y * 1.3 }); ring(); snd(260, 0.2, "square", 0.06, 200); break;
      case "rocket": b.rocketT = 45; ring(); snd(200, 0.5, "sawtooth", 0.05, 400); break;
      case "wave": b.waveT = 80; b.phase = 0; ring(); snd(500, 0.3, "sine", 0.06, 200); break;
      case "cluster": b.dropN = 3; b.dropCd = 0; ring(); break;
      case "royal": b.bomb = true; b.bombR = 170; b.bombP = 420; Body.setVelocity(b, { x: v.x * 1.4, y: v.y * 1.4 }); ring(); snd(440, 0.25, "sawtooth", 0.06, 440); break;
    }
  }
  function abilityTick() {
    const b = bird;
    if (!b || !b.flying || b.dead) return;
    if (b.floatT > 0) { b.floatT--; Body.applyForce(b, b.position, { x: 0, y: -b.mass * 0.001 * 0.97 }); }
    if (b.rocketT > 0) { b.rocketT--; const v = b.velocity, sp = Math.hypot(v.x, v.y); if (sp < 34) Body.setVelocity(b, { x: v.x * 1.03, y: v.y * 1.03 - 0.2 }); }
    if (b.waveT > 0) { b.waveT--; b.phase += 0.4; Body.setVelocity(b, { x: b.velocity.x, y: b.velocity.y + Math.sin(b.phase) * 1.4 }); }
    if (b.dropN > 0 && --b.dropCd <= 0) {
      spawnChild(b.position.x, b.position.y + b.r + 3, 9, "#222", b.velocity.x * 0.5, 1, { kind: "mini", bomb: true, bombR: 70, bombP: 200, density: 0.01 });
      b.dropN--; b.dropCd = 14; snd(300, 0.08, "square", 0.04, -100);
    }
  }
  function processBlasts() {
    while (blasts.length) {
      const e = blasts.pop();
      rings.push({ x: e.x, y: e.y, r: 10, a: 1.2 });
      burst(e.x, e.y, ["#ffd23f", "#ff7a2a", "#ffffff"], 26, 8); shake = Math.max(shake, 10); snd(90, 0.35, "sawtooth", 0.1, -40);
      for (const b of items) {
        const dx = b.position.x - e.x, dy = b.position.y - e.y, d = Math.hypot(dx, dy) || 1;
        const size = b.r || Math.max(b.w, b.h) / 2;
        if (d < e.R + size) {
          const fall = Math.max(0, 1 - d / (e.R + size));
          hurt(b, e.P * fall);
          const s = 9 * fall;
          Body.setVelocity(b, { x: b.velocity.x + dx / d * s, y: b.velocity.y + dy / d * s - 3 * fall });
        }
      }
    }
  }

  // ---------- collisions ----------
  function massOf(b) { return b.isStatic ? 2 : Math.min(b.mass, 8); }
  function hurt(b, d) { if (b.hp === undefined) return; b.hp -= d; b.hit = 8; }
  function onCollide(ev) {
    for (const p of ev.pairs) {
      const a = p.bodyA, b = p.bodyB;
      const rv = Math.hypot(a.velocity.x - b.velocity.x, a.velocity.y - b.velocity.y);
      for (const x of [a, b]) if (x.bomb && !x.done && rv > 1.2) { x.done = true; x.dead = true; blasts.push({ x: x.position.x, y: x.position.y, R: x.bombR, P: x.bombP }); }
      if (rv < 1.8) continue;
      const bm = a.label === "bird" ? a : (b.label === "bird" ? b : null), other = bm === a ? b : a;
      let f = (rv - 1.5) * 2.2 * (bm ? (bm.dmgMult || 1.5) : 1);
      if (bm && bm.hammer && other.mat === "stone") f *= 3;
      hurt(a, f * massOf(b)); hurt(b, f * massOf(a));
      if (rv > 6) snd(150 + Math.random() * 60, 0.07, "triangle", 0.04);
    }
  }
  function onActive(ev) {
    for (const p of ev.pairs) {
      const a = p.bodyA, b = p.bodyB;
      let t = null, o = null;
      if (a.label === "target" && b.label === "block") { t = a; o = b; } else if (b.label === "target" && a.label === "block") { t = b; o = a; }
      if (t && o.position.y < t.position.y - 4) { t.hp -= 0.25 * o.mass; t.hit = Math.max(t.hit, 2); }
    }
  }

  // ---------- input ----------
  function pos(ev) { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height }; }
  cv.addEventListener("pointerdown", ev => {

        for (let i = 0; i < 46; i++) {
          vy += 0.2778; px += vx; py += vy;
          if (i % 3 === 2 && py < GY) { ctx.fillStyle = `rgba(255,247,232,${1 - i / 50})`; ctx.beginPath(); ctx.arc(px, py, 4, 0, 6.283); ctx.fill(); }
        }
      }
      for (const c of extras) {
        if (c.kind === "egg") { ctx.save(); ctx.translate(c.position.x, c.position.y); ctx.rotate(c.angle); ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(0, 0, c.r * 0.85, c.r * 1.1, 0, 0, 6.283); ctx.fill(); ctx.restore(); }
        else if (c.kind === "mini") { ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(c.position.x, c.position.y, c.r, 0, 6.283); ctx.fill(); ctx.fillStyle = "#ffa31a"; ctx.beginPath(); ctx.arc(c.position.x + 3, c.position.y - c.r, 3, 0, 6.283); ctx.fill(); }
        else drawBird(ctx, c.position.x, c.position.y, c.r, c.color, c.angle, c.tid);
      }
      if (bird) {
        if (bird.hammer || bird.rocketT > 0) { ctx.fillStyle = "rgba(255,200,80,0.35)"; ctx.beginPath(); ctx.arc(bird.position.x, bird.position.y, bird.r + 8, 0, 6.283); ctx.fill(); }
        drawBird(ctx, bird.position.x, bird.position.y, bird.r, bird.color, bird.flying ? bird.angle : 0, bird.tid);
      }
      ctx.strokeStyle = "#2a1408"; ctx.lineWidth = 6; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ANCH.x + 18, ANCH.y - 8); ctx.lineTo(bp.x, bp.y); ctx.stroke();
      ctx.strokeStyle = "#6a3b1c"; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(ANCH.x, ANCH.y + 50); ctx.lineTo(ANCH.x + 18, ANCH.y - 8); ctx.stroke();
      for (const r of rings) { ctx.strokeStyle = `rgba(255,255,255,${Math.min(1, r.a)})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, 6.283); ctx.stroke(); }
      for (const p of particles) {
        ctx.globalAlpha = Math.min(1, p.life / 25); ctx.fillStyle = p.c;
        if (p.chip) { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillRect(-p.s, -p.s / 3, p.s * 2, p.s * 0.66); ctx.restore(); } else ctx.fillRect(p.x, p.y, p.s, p.s);
      }
      ctx.globalAlpha = 1;
      ctx.font = "700 22px " + FONT; ctx.textAlign = "center";
      for (const f of floaters) { ctx.fillStyle = `rgba(255,226,110,${Math.min(1, f.t / 25)})`; ctx.fillText(f.txt, f.x, f.y); }
      ctx.fillStyle = "#fff7e8"; ctx.font = "700 28px " + FONT;
      ctx.textAlign = "left"; ctx.fillText("लेवल " + (level + 1), 24, 44);
      ctx.textAlign = "center"; ctx.fillText(String(score), W / 2, 44);
      ctx.textAlign = "left"; ctx.fillStyle = "#ffe36a"; ctx.fillText("सिक्के " + save.coins, W / 2 + 190, 44);
      if (bird && !bird.used && state === "play") {
        const t = TYPES[bird.tid];
        ctx.textAlign = "center"; ctx.fillStyle = "rgba(255,247,232,0.9)"; ctx.font = "600 22px " + FONT;
        ctx.fillText((bird.guest ? "मेहमान ★ " : "") + t.name + ": " + (bird.flying ? "टैप करो · " : "") + t.desc, W / 2, H - 14);
      }
      ctx.textAlign = "left";
    }
    ctx.restore();
  }

  // ---------- loop ----------
  let last = performance.now(), acc = 0;
  function frame(now) {
    const dt = Math.min(100, now - last); last = now;
    if (state === "play" || state === "won" || state === "lost") { acc += dt; while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; } }
    render(); requestAnimationFrame(frame);
  }
  engine = Engine.create();
  mainMenu();
  requestAnimationFrame(frame);
})();
</script>
</body>
