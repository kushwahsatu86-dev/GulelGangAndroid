<style>
:root{color-scheme:dark;--mint:#69f0cf;--blue:#43b6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101a3c;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none}
#gameShell{position:fixed;inset:0;background:#101a3c;overflow:hidden}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:#fff}
.pill{background:rgba(7,16,49,.76);border:1px solid rgba(255,255,255,.16);box-shadow:0 8px 24px #07112c40;border-radius:18px;padding:8px 13px;font-weight:800;font-size:clamp(11px,1.65vw,17px);backdrop-filter:blur(8px)}
#topbar{position:absolute;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;align-items:center;gap:8px}
#levelLabel{white-space:nowrap}
#stats{display:flex;gap:7px}
#difficulty{margin-left:auto}
.hudBtn{pointer-events:auto;color:white;border:1px solid #ffffff40;background:#152854c9;border-radius:16px;padding:8px 12px;font-size:18px;min-width:48px;min-height:42px;font-weight:900}
#controls{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));left:0;right:0;display:flex;align-items:end;justify-content:space-between;padding:0 4vw;pointer-events:none}
.controlGroup{display:flex;gap:12px;align-items:center}
.ctrl{pointer-events:auto;width:clamp(56px,10vw,84px);height:clamp(56px,10vw,84px);border-radius:22px;border:2px solid #ffffff70;background:linear-gradient(145deg,#254775e8,#101c43e8);box-shadow:inset 0 2px #ffffff25,0 8px 18px #08112c70;color:white;font-size:clamp(23px,4vw,36px);font-weight:900;display:grid;place-items:center;touch-action:none}
.ctrl:active,.ctrl.active{transform:translateY(2px);background:linear-gradient(145deg,#3ca5e8,#1b4c89)}
#jump{width:clamp(68px,12vw,98px);height:clamp(68px,12vw,98px);border-radius:50%;background:linear-gradient(145deg,#ffe98d,#d69b2b);border:3px solid #fff1a9;color:#162447;font-size:clamp(27px,4.5vw,39px)}
#overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#07112cd9,#102e56c9);padding:18px}
.panel{width:min(560px,92vw);max-height:92%;overflow:auto;text-align:center;background:linear-gradient(150deg,#1d3970f5,#101a3cf5);border:1px solid #ffffff38;border-radius:26px;padding:clamp(18px,4vw,30px);box-shadow:0 24px 70px #0008}
.logo{width:66px;height:66px;margin:0 auto 8px;border-radius:19px;background:linear-gradient(145deg,#6df5d3,#277cff);display:grid;place-items:center;color:#0e1b3e;font-weight:1000;font-size:40px;border:3px solid #e4fff7;box-shadow:0 8px 28px #3bc7ff55}
h1{margin:8px 0;font-size:clamp(22px,4vw,34px);line-height:1.05}
.sub{color:#c3d8ff;font-size:14px;line-height:1.5;margin:8px 0 18px}
.row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.choice,.primary,.secondary{border:1px solid #ffffff35;border-radius:14px;padding:11px 15px;color:#fff;background:#263f70;font-weight:800;font-size:14px}
.choice.selected{background:linear-gradient(135deg,#69f0cf,#38a8ff);color:#10203f;border-color:#c4fff0}
.primary{background:linear-gradient(135deg,#73f4d2,#3ca9ff);color:#0c1c3a;border:0;min-width:180px;font-size:16px;box-shadow:0 7px 18px #37b6d844}
.secondary{background:#ffffff12}
#levelGrid{display:grid;grid-template-columns:repeat(10,minmax(22px,1fr));gap:5px;margin:12px 0}
.levelCell{border:1px solid #ffffff22;background:#172951;color:#a8bbdf;border-radius:7px;padding:7px 0;font-size:11px;font-weight:800}
.levelCell.open{background:#254e79;color:#fff}
.levelCell.done{background:#1b886f;color:#fff}
.note{font-size:11px;color:#b7c9ed;margin-top:12px}
#toast{position:absolute;left:50%;top:24%;transform:translate(-50%,-10px);opacity:0;background:#091633e8;border:1px solid #ffffff45;border-radius:15px;padding:10px 15px;font-weight:800;transition:.2s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (orientation:portrait){
 /* Place the rotated landscape viewport inside the portrait viewport.
    Setting left to 100vw prevents the game from being pushed off-screen. */
 #gameShell{inset:auto;left:100vw;top:0;width:100dvh;height:100vw;transform-origin:top left;transform:rotate(90deg);}
}
</style>
</head>
<body>
<div id="gameShell">
<canvas id="c" aria-label="M Sky Adventure game"></canvas>
<div id="hud">
 <div id="topbar">
  <div class="pill" id="levelLabel">LEVEL 1 / 100</div>
  <div id="stats"><div class="pill">◆ <span id="coins">0</span></div><div class="pill">♥ <span id="lives">3</span></div></div>
  <div class="pill" id="difficulty">NORMAL</div>
  <button class="hudBtn" id="pause" aria-label="Pause">Ⅱ</button>
 </div>
 <div id="controls">
  <div class="controlGroup"><button class="ctrl" id="left" aria-label="Left">◀</button><button class="ctrl" id="right" aria-label="Right">▶</button></div>
  <button class="ctrl" id="jump" aria-label="Jump">⬆</button>
 </div>
 <div id="toast"></div>
</div>
<div id="overlay">
 <div class="panel" id="panel">
  <div class="logo">M</div>
  <h1>M SKY ADVENTURE</h1>
  <div class="sub">100 अलग-अलग प्लेटफ़ॉर्म लेवल • रंगीन 3D-जैसा लुक • कॉइन, दुश्मन और सेव प्रोग्रेस</div>
  <div style="font-weight:800">कठिनाई चुनें</div>
  <div class="row" id="difficultyChoices">
   <button class="choice" data-diff="easy">आसान</button>
   <button class="choice selected" data-diff="normal">सामान्य</button>
   <button class="choice" data-diff="hard">कठिन</button>
  </div>
  <div class="row"><button class="primary" id="start">गेम शुरू करें ▶</button><button class="secondary" id="levelsBtn">लेवल चुनें</button></div>
  <div class="note">लैंडस्केप स्क्रीन अपने-आप • गिरने पर सुरक्षित चेकपॉइंट से वापसी • प्रोग्रेस इस डिवाइस में सेव</div>
 </div>
</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=960,H=540,scale=1,camX=0,last=0,raf=0,mode='menu',difficulty='normal',level=1,coins=0,lives=3,world=null,player=null,keys={left:false,right:false},jumpQueued=false,toastTimer=0,levelPick=false;
const saveKey='mskyadventure_save_v1';
let saved={unlocked:1,coins:0,done:[],difficulty:'normal',currentLevel:1};
try{saved={...saved,...JSON.parse(localStorage.getItem(saveKey)||'{}')}}catch(e){}
coins=saved.coins||0;difficulty=saved.difficulty||'normal';
function save(){try{localStorage.setItem(saveKey,JSON.stringify(saved))}catch(e){}}
function resize(){const dpr=Math.min(devicePixelRatio||1,2);/* clientWidth/clientHeight are the unrotated landscape layout size; getBoundingClientRect() is rotated on portrait phones. */const cw=canvas.clientWidth||960,ch=canvas.clientHeight||540;canvas.width=Math.max(1,Math.round(cw*dpr));canvas.height=Math.max(1,Math.round(ch*dpr));W=960;H=540;const sx=canvas.width/W,sy=canvas.height/H;ctx.setTransform(sx,0,0,sy,0,0);}
window.addEventListener('resize',resize);screen.orientation?.lock?.('landscape').catch?.(()=>{});resize();
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),1500)}
function randGen(seed){return ()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
const diffSettings={easy:{speed:3.5,jump:10.8,gap:.76,enemy:.7,label:'आसान'},normal:{speed:4.1,jump:10.4,gap:1,label:'सामान्य'},hard:{speed:4.7,jump:10.1,gap:1.22,label:'कठिन'}};
function buildLevel(n){
 const rnd=randGen(n*9176+321),d=diffSettings[difficulty],plats=[],gems=[],enemies=[],checkpoints=[],powerBoxes=[];
 let x=0,y=410;plats.push({x:0,y:445,w:390,h:95,type:'ground'});
 let total=3800+n*37;
 while(x<total){
  let gap=(95+rnd()*90)*d.gap, pw=120+rnd()*120;
  x+=gap;
  y=Math.max(260,Math.min(435,y+(rnd()-.48)*115));
  if(n%10===0 && rnd()>.55)y=310+rnd()*75;
  plats.push({x,y,w:pw,h:20,type:rnd()>.72?'moving':'grass',phase:rnd()*6,amp:rnd()>.6?18:0,baseY:y});
  for(let j=0;j<1+Math.floor(rnd()*3);j++)gems.push({x:x+24+j*29,y:y-35-rnd()*13,r:10,got:false,bob:rnd()*6});
  // Power boxes are intentionally rare: roughly one every 8 platforms, with some skipped.
  if(plats.length%8===0 && rnd()>.25)powerBoxes.push({x:x+pw*.5-14,y:y-57,w:28,h:28,used:false,bob:rnd()*6,type:['speed','jump','shield','bonus'][Math.floor(rnd()*4)]});
  if(n>1 && rnd()<(.16+(n/100)*.14))enemies.push({x:x+pw*.55,y:y-29,w:28,h:29,minX:x+8,maxX:x+pw-34,vx:(rnd()>.5?1:-1)*(.6+n*.009),alive:true});
  if(n%4===0 && plats.length%5===0)checkpoints.push({x:x+pw*.45,y:y-35,platformX:x,platformY:y,platformW:pw,active:false});
  x+=pw;
 }
 plats.push({x:total+100,y:445,w:440,h:95,type:'ground'});
 return {plats,gems,enemies,checkpoints,powerBoxes,endX:total+390,seed:n};
}
function startLevel(n){level=Math.max(1,Math.min(100,n));saved.currentLevel=level;saved.difficulty=difficulty;save();world=buildLevel(level);lives=3;camX=0;
 const p0=world.plats[0];player={x:70,y:p0.y-48,w:32,h:45,vx:0,vy:0,onGround:false,spawnX:70,spawnY:p0.y-48,face:1,invuln:0,anim:0,powerTimer:0,powerType:'',shield:0};
 mode='play';$('overlay').style.display='none';updateHud();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);}
function updateHud(){$('levelLabel').textContent=`LEVEL ${level}/100`;$('coins').textContent=coins;$('lives').textContent=lives;$('difficulty').textContent=diffSettings[difficulty].label.toUpperCase();document.querySelectorAll('[data-diff]').forEach(b=>b.classList.toggle('selected',b.dataset.diff===difficulty));}
function drawBackground(t){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#12224f');g.addColorStop(.55,'#2765a6');g.addColorStop(1,'#7bd0e8');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // sun glow
 let sg=ctx.createRadialGradient(785,90,10,785,90,90);sg.addColorStop(0,'#fff7bfdd');sg.addColorStop(1,'#fff7bf00');ctx.fillStyle=sg;ctx.fillRect(680,0,210,200);ctx.fillStyle='#fff0a8';ctx.beginPath();ctx.arc(785,90,26,0,Math.PI*2);ctx.fill();
 for(let i=0;i<5;i++){let cx=((i*245-camX*.12)%(W+240)+W+240)%(W+240)-100,cy=90+(i%3)*60;ctx.fillStyle='#ffffff25';ctx.beginPath();ctx.ellipse(cx,cy,38,16,0,0,Math.PI*2);ctx.ellipse(cx+24,cy-9,26,22,0,0,Math.PI*2);ctx.ellipse(cx+49,cy,35,15,0,0,Math.PI*2);ctx.fill()}
 // distant layered hills
 for(let layer=0;layer<3;layer++){let base=360+layer*42;ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,base);for(let x=-100-(camX*(.12+layer*.09)%180);x<W+180;x+=180){ctx.lineTo(x+90,base-65-layer*9);ctx.lineTo(x+180,base+12)}ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle=['#1c567d','#17476c','#153958'][layer];ctx.fill()}
}
function roundRect(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function drawPlatform(p,t){
 let x=p.x-camX,y=p.y;
 if(p.type==='moving'){y=p.baseY+Math.sin(t*.0018+p.phase)*p.amp}
 if(x+p.w< -40||x>W+40)return;
 // shadow and side face for pseudo-3D depth
 roundRect(x+4,y+8,p.w,p.h+12,5,'#11274470');
 roundRect(x,y+10,p.w,p.h+11,5,'#75452f');
 ctx.fillStyle='#b56b43';ctx.fillRect(x+3,y+13,p.w-6,p.h+3);
 ctx.fillStyle='#8d5139';for(let k=12;k<p.w;k+=37){ctx.beginPath();ctx.arc(x+k,y+26,3,0,Math.PI*2);ctx.fill()}
 roundRect(x,y,p.w,13,5,p.type==='ground'?'#57dfae':'#53e2ac');
 ctx.fillStyle='#b4ffe4';for(let k=8;k<p.w-4;k+=30){ctx.beginPath();ctx.moveTo(x+k,y+1);ctx.lineTo(x+k+5,y-7);ctx.lineTo(x+k+10,y+1);ctx.fill()}
 ctx.fillStyle='#ffffff30';ctx.fillRect(x+5,y+3,Math.max(0,p.w-10),2);
}
function drawGem(g,t){if(g.got)return;let x=g.x-camX,y=g.y+Math.sin(t*.004+g.bob)*5;ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(t*.003+g.bob)*.15);ctx.shadowColor='#fff09b';ctx.shadowBlur=13;ctx.fillStyle='#ffdb4e';ctx.beginPath();ctx.moveTo(0,-12);ctx.lineTo(9,-2);ctx.lineTo(0,12);ctx.lineTo(-9,-2);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff7bf';ctx.lineWidth=2;ctx.stroke();ctx.restore()}
function drawPowerBox(b,t){if(b.used)return;const x=b.x-camX,y=b.y+Math.sin(t*.004+b.bob)*4;if(x< -40||x>W+40)return;const colors={speed:'#62f5d4',jump:'#a78bfa',shield:'#60c9ff',bonus:'#ffd95b'};const symbols={speed:'»',jump:'↑',shield:'✦',bonus:'◆'};ctx.save();ctx.translate(x+b.w/2,y+b.h/2);ctx.rotate(Math.sin(t*.003+b.bob)*.06);ctx.shadowColor=colors[b.type];ctx.shadowBlur=17;const grad=ctx.createLinearGradient(-12,-12,12,12);grad.addColorStop(0,'#fff');grad.addColorStop(.25,colors[b.type]);grad.addColorStop(1,'#3159a5');roundRect(-14,-14,28,28,7,grad,'#ffffff');ctx.shadowBlur=0;ctx.fillStyle='#102044';ctx.font='bold 19px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(symbols[b.type],0,1);ctx.restore()}
function drawEnemy(e,t){if(!e.alive)return;let x=e.x-camX,y=e.y;ctx.save();ctx.translate(x+e.w/2,y+e.h/2);ctx.fillStyle='#55275e';ctx.beginPath();ctx.ellipse(0,2,15,15,0,0,Math.PI*2);ctx.fill();let gr=ctx.createLinearGradient(-10,-14,10,15);gr.addColorStop(0,'#ff9d72');gr.addColorStop(1,'#d83e63');ctx.fillStyle=gr;ctx.beginPath();ctx.ellipse(0,0,13,14,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='white';ctx.beginPath();ctx.arc(-4,-3,4,0,Math.PI*2);ctx.arc(5,-3,4,0,Math.PI*2);ctx.fill();ctx.fillStyle='#1a2445';ctx.beginPath();ctx.arc(-3,-2,1.8,0,Math.PI*2);ctx.arc(6,-2,1.8,0,Math.PI*2);ctx.fill();ctx.fillStyle='#492a50';ctx.fillRect(-9,12,7,5);ctx.fillRect(3,12,7,5);ctx.restore()}
function drawPlayer(t){
 if(!player)return;let p=player,x=p.x-camX,y=p.y;if(p.invuln>0&&Math.floor(t/90)%2===0)return;
 const bob=p.onGround?Math.sin(p.anim*.2)*1.2:0;
 // shadow
 ctx.fillStyle='#07162b55';ctx.beginPath();ctx.ellipse(x+p.w/2,y+p.h+3,17,5,0,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.translate(x+p.w/2,y+bob);if(p.face<0)ctx.scale(-1,1);
 // Animated legs and shoes: swing while running, tuck slightly while jumping.
 const swing=p.onGround&&Math.abs(p.vx)>0.2?Math.sin(p.anim*.85)*6:0;
 ctx.save();ctx.translate(-6,29);ctx.rotate(swing*.035);roundRect(-5,0,9,10,4,'#f1b26b','#9b633b');ctx.restore();
 ctx.save();ctx.translate(6,29);ctx.rotate(-swing*.035);roundRect(-4,0,9,10,4,'#f1b26b','#9b633b');ctx.restore();
 roundRect(-14,34+swing*.12,13,10,4,'#ffcf4f','#a56b36');roundRect(2,34-swing*.12,14,10,4,'#ffcf4f','#a56b36');
 // Small swinging arms add a clearer run cycle.
 ctx.save();ctx.translate(-13,14);ctx.rotate(-swing*.025);roundRect(-3,0,7,17,4,'#ffb941','#9b662f');ctx.restore();
 ctx.save();ctx.translate(13,14);ctx.rotate(swing*.025);roundRect(-3,0,7,17,4,'#ffb941','#9b662f');ctx.restore();
 // body with glossy side
 let body=ctx.createLinearGradient(-14,0,14,0);body.addColorStop(0,'#d93458');body.addColorStop(.45,'#ff6579');body.addColorStop(1,'#a91e4b');
 roundRect(-15,2,30,34,9,body,'#ff9ba6');
 ctx.fillStyle='#ffffff35';ctx.beginPath();ctx.ellipse(-6,10,4,11,-.2,0,Math.PI*2);ctx.fill();
 // backpack/side ear pads
 roundRect(-20,8,7,17,4,'#ffb941','#9b662f');roundRect(13,8,7,17,4,'#ffb941','#9b662f');
 // face
 let face=ctx.createLinearGradient(-10,5,11,29);face.addColorStop(0,'#ffe8bd');face.addColorStop(1,'#e8a66f');
 ctx.fillStyle=face;ctx.beginPath();ctx.ellipse(0,20,11,12,0,0,Math.PI*2);ctx.fill();
 // hair/helmet
 let hg=ctx.createLinearGradient(0,-4,0,10);hg.addColorStop(0,'#ff7890');hg.addColorStop(1,'#b91d49');ctx.fillStyle=hg;ctx.beginPath();ctx.roundRect(-14,-7,28,14,6);ctx.fill();ctx.fillStyle='#ffb1b5';ctx.fillRect(-8,-5,13,3);
 // eyes and smile
 ctx.fillStyle='#1c2844';ctx.beginPath();ctx.arc(-4,18,1.8,0,Math.PI*2);ctx.arc(4,18,1.8,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#9b4050';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(0,22,4,0.15,Math.PI-.15);ctx.stroke();
 // highlights
 ctx.fillStyle='#fff9';ctx.beginPath();ctx.arc(-7,14,1.4,0,Math.PI*2);ctx.fill();
 ctx.restore();
}
function drawCheckpoint(c){let x=c.x-camX;if(x< -30||x>W+30)return;ctx.fillStyle=c.active?'#fff59d':'#d6e7ff';ctx.fillRect(x, c.y,4,36);ctx.fillStyle=c.active?'#ffdc57':'#7de5ff';ctx.beginPath();ctx.moveTo(x+4,c.y+2);ctx.lineTo(x+27,c.y+10);ctx.lineTo(x+4,c.y+18);ctx.closePath();ctx.fill()}
function drawGoal(t){let x=world.endX-camX;if(x< -80||x>W+100)return;ctx.save();ctx.translate(x,360);ctx.shadowColor='#64ffdb';ctx.shadowBlur=20;ctx.strokeStyle='#a5ffe8';ctx.lineWidth=8;ctx.beginPath();ctx.ellipse(0,35,22,48,0,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffffffaa';ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillText('GO!',0,42);ctx.restore()}
function respawnPlayer(){if(!player)return;player.x=player.spawnX;player.y=player.spawnY;player.vx=0;player.vy=0;player.onGround=false;player.invuln=90;camX=Math.max(0,Math.min(world.endX-W+130,player.x-W*.32));}
function update(dt,t){
 if(mode!=='play'||!player)return;const p=player,d=diffSettings[difficulty],f=Math.min(dt/16.67,2.3);
 let dir=(keys.right?1:0)-(keys.left?1:0);const runSpeed=d.speed*(p.powerType==='speed'?1.65:1);p.vx=dir*runSpeed*f;if(dir)p.face=dir;p.anim+=Math.abs(p.vx)*.5;
 if(jumpQueued&&p.onGround){p.vy=-(d.jump*(p.powerType==='jump'?1.45:1));p.onGround=false;}jumpQueued=false;
 p.vy+=.48*f;p.vy=Math.min(p.vy,13);let oldY=p.y;p.x+=p.vx*f;p.y+=p.vy*f;p.onGround=false;
 // platforms: land only while falling; prevents teleporting to the wrong platform
 for(const pl of world.plats){let py=pl.type==='moving'?pl.baseY+Math.sin(t*.0018+pl.phase)*pl.amp:pl.y;
  if(p.x+p.w>pl.x+3&&p.x<pl.x+pl.w-3&&p.vy>=0&&oldY+p.h<=py+8&&p.y+p.h>=py){p.y=py-p.h;p.vy=0;p.onGround=true;}}
 // gems
 for(const g of world.gems){if(g.got)continue;let gx=g.x,gy=g.y+Math.sin(t*.004+g.bob)*5;if(p.x+p.w>gx-10&&p.x<gx+10&&p.y+p.h>gy-12&&p.y<gy+12){g.got=true;coins++;saved.coins=coins;save();updateHud();}}
 // Collect power boxes. Boost effects are temporary and have a visible toast.
 for(const b of world.powerBoxes){if(b.used)continue;const by=b.y+Math.sin(t*.004+b.bob)*4;if(p.x+p.w>b.x&&p.x<b.x+b.w&&p.y+p.h>by&&p.y<by+b.h){b.used=true;if(b.type==='bonus'){coins+=5;saved.coins=coins;save();toast('बोनस बॉक्स! +5 कॉइन ✨')}else{p.powerType=b.type;p.powerTimer=600;if(b.type==='shield'){p.shield=600;p.invuln=Math.max(p.invuln,600);toast('शील्ड पावर! 10 सेकंड 🛡️')}else if(b.type==='speed')toast('स्पीड पावर! 10 सेकंड ⚡');else toast('सुपर जंप! 10 सेकंड ⬆️')}updateHud();}}
 if(p.powerTimer>0){p.powerTimer=Math.max(0,p.powerTimer-f);if(p.powerTimer===0){p.powerType='';p.shield=0;toast('पावर खत्म')}}
 // checkpoints
 for(const c of world.checkpoints){if(!c.active&&p.x+p.w>c.x-5&&p.x<c.x+20&&p.y+p.h>c.y&&p.y<c.y+42){c.active=true;p.spawnX=Math.max(c.platformX+8,Math.min(c.x,c.platformX+c.platformW-p.w-8));p.spawnY=c.platformY-p.h-1;toast('चेकपॉइंट सेव!');}}
 // enemies: stomping defeats; otherwise damage with brief invulnerability
 for(const e of world.enemies){if(!e.alive)continue;e.x+=e.vx*f;if(e.x<e.minX||e.x>e.maxX)e.vx*=-1;
  if(p.x+p.w>e.x+3&&p.x<e.x+e.w-3&&p.y+p.h>e.y+3&&p.y<e.y+e.h-2){
   if(p.vy>1&&oldY+p.h<e.y+13){e.alive=false;p.vy=-6.3;coins+=2;saved.coins=coins;save();updateHud();}
   else if(p.invuln<=0){lives--;p.invuln=85;p.vx=-p.face*4;p.vy=-5;updateHud();if(lives<=0){lives=3;respawnPlayer();toast('चेकपॉइंट से फिर शुरू');updateHud();}}
  }}
 p.invuln=Math.max(0,p.invuln-f);if(p.powerType==='shield'&&p.powerTimer>0)p.invuln=Math.max(p.invuln,2);
 if(p.y>H+180||p.x<camX-180){respawnPlayer();toast('सेफ़ चेकपॉइंट पर वापसी');}
 camX=Math.max(0,Math.min(world.endX-W+130,p.x-W*.32));
 if(p.x>world.endX-40){completeLevel();}
}
function completeLevel(){if(mode!=='play')return;mode='win';saved.done=saved.done||[];if(!saved.done.includes(level))saved.done.push(level);saved.unlocked=Math.max(saved.unlocked||1,Math.min(100,level+1));saved.currentLevel=Math.min(100,level+1);saved.coins=coins;saved.difficulty=difficulty;save();$('overlay').style.display='flex';$('panel').innerHTML=`<div class="logo">M</div><h1>लेवल ${level} पूरा! ✨</h1><div class="sub">शानदार! कॉइन्स: ${coins}<br>तुम्हारी प्रोग्रेस अपने-आप सेव हो गई।</div><div class="row"><button class="primary" id="nextBtn">${level<100?'अगला लेवल ▶':'फिर से खेलें ↻'}</button><button class="secondary" id="menuBtn">मेन्यू</button></div>`;$('nextBtn').onclick=()=>startLevel(level<100?level+1:1);$('menuBtn').onclick=showMenu;}
function draw(t){
 drawBackground(t);
 if(world){for(const pl of world.plats)drawPlatform(pl,t);for(const b of world.powerBoxes)drawPowerBox(b,t);for(const c of world.checkpoints)drawCheckpoint(c);for(const g of world.gems)drawGem(g,t);for(const e of world.enemies)drawEnemy(e,t);drawGoal(t);drawPlayer(t);}
}
function loop(t){if(mode!=='play')return;let dt=Math.min(40,t-last||16);last=t;update(dt,t);draw(t);raf=requestAnimationFrame(loop)}
function showMenu(){mode='menu';$('overlay').style.display='flex';$('panel').innerHTML=`<div class="logo">M</div><h1>M SKY ADVENTURE</h1><div class="sub">100 अलग-अलग लेवल • पावर बॉक्स, सुपर जंप, स्पीड बूस्ट, शील्ड और रनिंग एनिमेशन</div><div style="font-weight:800">कठिनाई चुनें</div><div class="row" id="difficultyChoices"><button class="choice" data-diff="easy">आसान</button><button class="choice" data-diff="normal">सामान्य</button><button class="choice" data-diff="hard">कठिन</button></div><div class="row"><button class="primary" id="start">गेम शुरू करें ▶</button><button class="secondary" id="continueBtn">जारी रखें ↻</button><button class="secondary" id="levelsBtn">लेवल चुनें</button></div><div class="note">लैंडस्केप स्क्रीन • गिरने पर चेकपॉइंट से वापसी • प्रोग्रेस सेव</div>`;wireMenu();updateHud()}
function wireMenu(){document.querySelectorAll('[data-diff]').forEach(b=>b.onclick=()=>{difficulty=b.dataset.diff;saved.difficulty=difficulty;save();updateHud()});$('start').onclick=()=>startLevel(1);const cb=$('continueBtn');if(cb)cb.onclick=()=>startLevel(Math.max(1,Math.min(100,saved.currentLevel||saved.unlocked||1)));$('levelsBtn').onclick=showLevels}
function showLevels(){let cells='';for(let i=1;i<=100;i++){let open=i<=(saved.unlocked||1),done=(saved.done||[]).includes(i);cells+=`<button class="levelCell ${done?'done':open?'open':''}" ${open?'':'disabled'} data-level="${i}">${i}</button>`} $('panel').innerHTML=`<div class="logo">M</div><h1>लेवल चुनें</h1><div class="sub">खुले हुए लेवल पर टैप करें</div><div id="levelGrid">${cells}</div><button class="secondary" id="backBtn">← वापस</button>`;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{if(!b.disabled)startLevel(+b.dataset.level)});$('backBtn').onclick=showMenu}
wireMenu();updateHud();
function bindHold(id,key){const el=$(id);const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('active')},up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('active')};el.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,up))}
bindHold('left','left');bindHold('right','right');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();jumpQueued=true;$('jump').classList.add('active')});['pointerup','pointercancel','pointerleave'].forEach(ev=>$('jump').addEventListener(ev,()=> $('jump').classList.remove('active')));
$('pause').onclick=()=>{if(mode==='play'){mode='paused';cancelAnimationFrame(raf);$('overlay').style.display='flex';$('panel').innerHTML=`<div class="logo">Ⅱ</div><h1>गेम रुका हुआ है</h1><div class="row"><button class="primary" id="resume">जारी रखें ▶</button><button class="secondary" id="restart">लेवल फिर शुरू करें</button><button class="secondary" id="mainMenu">मेन्यू</button></div>`;$('resume').onclick=()=>{mode='play';$('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(loop)};$('restart').onclick=()=>startLevel(level);$('mainMenu').onclick=showMenu}else if(mode==='paused'){mode='play';$('overlay').style.display='none';last=performance.now();raf=requestAnimationFrame(loop)}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.key==='ArrowUp'||e.key===' '||e.key==='w')jumpQueued=true;if(e.key==='Escape')$('pause').click()});
document.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false});
draw(0);
})();
</script>
</body>
</html>
