
name: HTML Game to APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Game app name"
        required: true
        default: "My Game"
        type: string
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Create Android wrapper
        env:
          GAME_NAME: ${{ inputs.app_name }}
        shell: bash
        run: |
          set -e

          test -f index.html || {
            echo "ERROR: Add your game as index.html"
            exit 1
          }

          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/game/builder
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          python3 - <<'PY'
          import os
          from xml.sax.saxutils import escape
          name = os.environ.get("GAME_NAME", "").strip() or "My Game"
          with open("app/src/main/res/values/strings.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n')
              f.write('<resources><string name="app_name">' + escape(name) + '</string></resources>')
          PY

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HTMLGame"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
          }
          EOF

          echo "android.useAndroidX=true" > gradle.properties

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }
          android {
              namespace = "com.game.builder"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.game.builder"
                  minSdk = 23
                  targetSdk = 28
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="landscape"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/game/builder/MainActivity.java <<'EOF'
          package com.game.builder;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              @Override
              public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(5894 | 1024 | 512);
                  WebView web = new WebView(this);
                  web.setWebViewClient(new WebViewClient());
                  web.getSettings().setJavaScriptEnabled(true);
                  web.getSettings().setDomStorageEnabled(true);
                  web.loadUrl("file:///android_asset/index.html");
                  setContentView(web);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-Game-APK
          path: app/build/outputs/apk/debug/app-debug.apk
